<h1>Welcome to {{ portalName }}</h1>

<p>
  Hello {{ studentName }}, welcome to your student portal.
</p>

<div class="stats">

  <div>
    <h2>{{ courseCount }}</h2>
    <p>Courses Available</p>
  </div>

  <div>
    <h2>{{ enrolledCount }}</h2>
    <p>Enrolled</p>
  </div>

  <div>
    <h2>{{ gpa }}</h2>
    <p>GPA</p>
  </div>

</div>

<div class="student-section">

  <h3>Student Name</h3>

  <input
    type="text"
    [(ngModel)]="studentName"
    placeholder="Enter your name">

  <p>Hello {{ studentName }}</p>

  <button
    [disabled]="!isPortalActive"
    (click)="enroll()">
    Enroll Now
  </button>

  <p>{{ message }}</p>

</div>

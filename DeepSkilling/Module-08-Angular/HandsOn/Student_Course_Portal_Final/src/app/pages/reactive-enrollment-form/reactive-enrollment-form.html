<section class="reactive-form">

  <h1>Reactive Enrollment Form</h1>

  <form
    [formGroup]="enrollForm"
    (ngSubmit)="onSubmit()">

    <div class="field">

      <label for="studentName">
        Student Name
      </label>

      <input
        id="studentName"
        type="text"
        formControlName="studentName">

      <span
        *ngIf="
          enrollForm.get('studentName')?.touched &&
          enrollForm.get('studentName')?.errors?.['required']
        ">
        Name is required
      </span>

      <span
        *ngIf="
          enrollForm.get('studentName')?.touched &&
          enrollForm.get('studentName')?.errors?.['minlength']
        ">
        Name must be at least 3 characters
      </span>

    </div>

    <div class="field">

      <label for="studentEmail">
        Email
      </label>

      <input
        id="studentEmail"
        type="email"
        formControlName="studentEmail">

      <span
        *ngIf="
          enrollForm.get('studentEmail')?.touched &&
          enrollForm.get('studentEmail')?.errors?.['required']
        ">
        Email is required
      </span>

      <span
        *ngIf="
          enrollForm.get('studentEmail')?.touched &&
          enrollForm.get('studentEmail')?.errors?.['email']
        ">
        Enter a valid email
      </span>

      <span
        *ngIf="
          enrollForm.get('studentEmail')?.errors?.['emailTaken']
        ">
        Email taken
      </span>

    </div>

    <div class="field">

      <label for="courseId">
        Course ID
      </label>

      <input
        id="courseId"
        type="text"
        formControlName="courseId">

      <span
        *ngIf="
          enrollForm.get('courseId')?.touched &&
          enrollForm.get('courseId')?.errors?.['required']
        ">
        Course ID is required
      </span>

      <span
        *ngIf="
          enrollForm.get('courseId')?.errors?.['noCourseCode']
        ">
        Course code starting with XX is not allowed.
      </span>

    </div>

    <div class="field">

      <label for="preferredSemester">
        Preferred Semester
      </label>

      <select
        id="preferredSemester"
        formControlName="preferredSemester">

        <option value="Odd">
          Odd
        </option>

        <option value="Even">
          Even
        </option>

      </select>

    </div>

    <div class="field checkbox">

      <input
        id="agreeToTerms"
        type="checkbox"
        formControlName="agreeToTerms">

      <label for="agreeToTerms">
        I agree to the terms and conditions
      </label>

    </div>

    <div formArrayName="additionalCourses">

      <h3>Additional Courses</h3>

      <div
        *ngFor="
          let ctrl of additionalCourses.controls;
          let i = index
        ">

        <input
          [formControlName]="i">

        <button
          type="button"
          (click)="removeCourse(i)">
          Remove
        </button>

      </div>

      <button
        type="button"
        (click)="addCourse()">
        Add Course
      </button>

    </div>

    <button
      type="submit"
      [disabled]="enrollForm.invalid">
      Submit
    </button>

  </form>

</section>

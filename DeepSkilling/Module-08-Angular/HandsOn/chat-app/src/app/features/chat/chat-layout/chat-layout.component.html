<div class="shell">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <span class="logo-mark">CF</span>
        <span class="logo-text">ChatFlow Mini</span>
      </div>
    </div>

    <div class="search-box">
      <input
        [formControl]="searchControl"
        type="search"
        placeholder="Search rooms..."
        (focus)="isSearchFocused.set(true)"
        (blur)="isSearchFocused.set(false)"
        [class.focused]="isSearchFocused()"
      />
    </div>

    <nav class="room-list" aria-label="Chat rooms">
      <p class="section-label">Rooms</p>
      @for (room of filteredRooms; track room.id) {
        <div class="room-item-container" [routerLinkActive]="'active'" [routerLinkActiveOptions]="{exact: true}">
          <a
            class="room-item"
            [routerLink]="['/chat', room.id]"
            [class.is-user-in-room]="isUserInRoom(room.id)"
            [title]="getPresenceTooltip(room.id)"
          >
            <div class="room-item-content">
              <span class="hash">#</span>
              <span class="room-name">{{ room.name }}</span>
            </div>
            <div class="room-item-meta">
              <span class="room-user-count" [class.has-users]="getOnlineUsersCount(room.id) > 0">
                {{ getOnlineUsersCount(room.id) }}
                <span class="user-dot" [class.online]="getOnlineUsersCount(room.id) > 0"></span>
              </span>
            </div>
          </a>

          <!-- Room description on hover -->
          @if (isUserInRoom(room.id)) {
            <div class="room-description tooltip">
              {{ room.description }}
            </div>
          }
        </div>
      } @empty {
        <p class="empty">No rooms found.</p>
      }
    </nav>

    <div class="sidebar-footer">
      @if (currentUser(); as user) {
        <div class="user-profile">
          <div class="avatar">{{ user.avatar }}</div>
          <div class="user-meta">
            <span class="user-name">{{ user.name }}</span>
            <div class="user-status-indicator">
              <span class="status-dot online"></span>
              <span class="status-text">online</span>
            </div>
          </div>
        </div>
      }
      <button class="icon-btn" type="button" (click)="logout()"
              [class.hover-effect]>
        Logout
      </button>
    </div>
  </aside>

  <main class="chat-area">
    <router-outlet />
  </main>
</div>
